name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Тесты Wisp
        run: |
          python3 -m venv "$RUNNER_TEMP/wisp-tests"
          source "$RUNNER_TEMP/wisp-tests/bin/activate"
          python -m pip install markdown-it-py==3.0.0 coverage==7.17.5
          google-chrome --version
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine --quiet
          python -m coverage report
      - name: Создание и проверка базы знаний
        run: |
          mkdir -p html
          cp _templates/Индекс.html html/index.html
          python3 scripts/wiki_html.py create "Проверка" --section "Входящие" --summary "Проверка новой базы" --heading "Пример"
          python3 scripts/wiki_html.py index --html-only
          python3 scripts/wiki_html.py check --html-only

  openspec:
    name: openspec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Проверка спек и изменений
        run: npx --yes @fission-ai/openspec@2.0.0 validate --all --strict --no-interactive
